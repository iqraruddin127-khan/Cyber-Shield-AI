<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" fill="#3B82F6" opacity="0.2" stroke="#3B82F6" stroke-width="1.5"/>
          <path d="M12 8v4m0 4h.01" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="title">CyberShield AI</span>
      </div>
      <div class="status" id="status-dot">
        <span class="dot"></span>
        <span id="status-text">Checking...</span>
      </div>
    </div>

    <!-- Scan Input -->
    <div class="scan-section">
      <label class="input-label">Scan URL for threats</label>
      <div class="input-row">
        <input type="url" id="url-input" placeholder="https://example.com" spellcheck="false" autocomplete="off">
        <button id="scan-btn" title="Scan URL">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Current Page Scan -->
    <div class="current-page-section">
      <button id="scan-page-btn" class="scan-page-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Scan current page
      </button>
    </div>

    <!-- Result -->
    <div class="result" id="result" hidden>
      <div class="result-icon" id="result-icon"></div>
      <div class="result-text">
        <div class="result-status" id="result-status"></div>
        <div class="result-url" id="result-url"></div>
      </div>
    </div>

    <!-- History -->
    <div class="history-section">
      <div class="history-header">
        <span class="history-title">Recent Scans</span>
        <button id="clear-history" class="clear-btn" title="Clear history">Clear</button>
      </div>
      <div id="history-list" class="history-list">
        <div class="history-empty">No scans yet</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>Powered by CyberShield AI Backend</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
